# ==============================================================================
# AcneVision - E7: resep E4 (fine-tune tile 2x2) dengan arsitektur YOLO11l
# ==============================================================================
# Salinan configs/yolov8l_960_tiles2_ft.yaml; yang berubah HANYA `model` (init dari E6) dan `name`.
# Data data_tiles2/, jadwal, loss, augmentasi identik E4. Dievaluasi plain + SAHI 1728.
# Dipakai oleh: scripts/run_yolo11.ps1
# ==============================================================================
# Hipotesis: melatih ulang E3 pada tile resolusi penuh (lesi tampil ~2x lebih besar)
# lalu inferensi SAHI (slice ~1728 px -> 960) menaikkan recall lesi kecil.
# Dasar: Akyon et al. 2022 (SAHI) - slicing aided fine-tuning + sliced inference.
# Dataset: python scripts/data/preprocess.py --grid 2 --overlap 0.1
# Augmentasi & loss identik E3; yang berubah hanya data (tile) + jadwal fine-tune.
# Anggaran GPU terbatas (<= 4 jam total) -> 10 epoch fine-tune, bukan dari nol.
# ==============================================================================

model: runs/detect/yolo11l_960/weights/best.pt   # Inisialisasi dari E6
data: data_tiles2/data.yaml
name: yolo11l_960_tiles2_ft

# --- Jadwal fine-tune ---
epochs: 10
patience: 10
imgsz: 960
batch: 4
workers: 2
seed: 42
deterministic: true

optimizer: AdamW
lr0: 0.0002          # 1/5 lr E3: fine-tune, bukan training dari awal
lrf: 0.1
cos_lr: true
warmup_epochs: 1
weight_decay: 0.0005

# --- Loss (sama dengan E3) ---
box: 10.0
cls: 0.3
dfl: 2.0

# --- Augmentasi (sama dengan E3) ---
mosaic: 1.0
close_mosaic: 3
mixup: 0.1
copy_paste: 0.0
fliplr: 0.5
flipud: 0.5
degrees: 10.0
translate: 0.1
scale: 0.5
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
