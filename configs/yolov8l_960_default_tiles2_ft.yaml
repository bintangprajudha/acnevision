# ==============================================================================
# AcneVision - E5: Slicing-aided fine-tuning dari B0 (pembanding E4, init berbeda)
# ==============================================================================
# Hipotesis: tile fine-tune (data_tiles2) + SAHI juga menaikkan recall bila dimulai dari B0.
# Bersama B0+SAHI, E3+SAHI, dan E4+SAHI membentuk desain 2x2 (init B0/E3 x tile-FT ya/tidak),
# sehingga efek tile-FT dan efek tuning E3 dapat dipisahkan.
# Config = salinan configs/yolov8l_960_tiles2_ft.yaml; yang berubah HANYA `model` (dan `name`).
# Catatan: loss & augmentasi mengikuti E4 (setelan E3), bukan default B0.
# Dataset: python scripts/data/preprocess.py --grid 2 --overlap 0.1 (sudah ada di data_tiles2/)
# ==============================================================================

model: runs/detect/yolov8l_960_default/weights/best.pt   # Inisialisasi dari B0
data: data_tiles2/data.yaml
name: yolov8l_960_default_tiles2_ft

# --- Jadwal fine-tune ---
epochs: 10
patience: 10
imgsz: 960
batch: 4
workers: 2
seed: 42
deterministic: true

optimizer: AdamW
lr0: 0.0002          # 1/5 lr E3: fine-tune, bukan training dari awal
lrf: 0.1
cos_lr: true
warmup_epochs: 1
weight_decay: 0.0005

# --- Loss (sama dengan E4) ---
box: 10.0
cls: 0.3
dfl: 2.0

# --- Augmentasi (sama dengan E4) ---
mosaic: 1.0
close_mosaic: 3
mixup: 0.1
copy_paste: 0.0
fliplr: 0.5
flipud: 0.5
degrees: 10.0
translate: 0.1
scale: 0.5
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
