# ==============================================================================
# AcneVision - B1: baseline YOLO11n @ 640 (jangkar pembanding SAT-AcneDet)
# ==============================================================================
# SAT-AcneDet (SPIE 2026) melaporkan YOLO11n mAP@50 0.573 / recall 0.518 pada ACNE04-v2
# (split & imgsz tidak diketahui). Menjalankan YOLO11n pada split KITA mengecek apakah split
# kita setara: hasil ~0.57 -> sebanding; jauh berbeda -> selisih mungkin efek split.
# Beda dari E6 (yolo11l_960): arsitektur n, imgsz 640 (ASUMSI: default Ultralytics), batch 16.
# Resep lain = E3. Bobot COCO diunduh otomatis ke pretrained/yolo11n.pt saat run pertama.
# Dipakai oleh: scripts/run_baseline_b1.ps1
# ==============================================================================

model: pretrained/yolo11n.pt   # Pretrained COCO (YOLO11n)
data: data/data.yaml
name: yolo11n_640

# --- Jadwal training ---
epochs: 100
patience: 25
imgsz: 640          # yolo11n kecil; 640 = ukuran default Ultralytics
batch: 16         # nbs=64 -> akumulasi 4 step
workers: 2          # >2 memicu lonjakan RAM di Windows
seed: 42
deterministic: true

# --- Optimizer ---
optimizer: AdamW
lr0: 0.001
lrf: 0.01
cos_lr: true
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
warmup_momentum: 0.8

# --- Bobot loss (single-class, objek kecil) ---
box: 10.0
cls: 0.3
dfl: 2.0

# --- Augmentasi ---
mosaic: 1.0
close_mosaic: 10
mixup: 0.1
copy_paste: 0.0     # Run asli memakai 0.3, tetapi copy_paste hanya aktif untuk label segmentasi
                    # (label kita bbox) sehingga no-op. Diset 0.0 agar jujur; hasil identik.
fliplr: 0.5
flipud: 0.5
degrees: 10.0
translate: 0.1
scale: 0.5
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
