# ==============================================================================
# AcneVision - E11: resep E3 + augmentasi noise & kecerahan/kontras
# ==============================================================================
# Hipotesis: noise Gaussian + variasi kecerahan/kontras membuat model lebih tahan kualitas foto.
# Dasar: Zhang et al. 2024 (IEEE Access, DOI 10.1109/ACCESS.2024.3520641) - augmentasi rotasi, cermin,
# kecerahan, noise Gaussian (rotasi & cermin sudah aktif di E3: degrees 10, flip 0.5).
# Satu variabel vs E3: blok `albumentations` (dibangun train.py, menggantikan default Ultralytics p=0.01).
# Tahap 1 (screening): dinilai hanya di split val (scripts/evaluate.py --val-only), dibandingkan dengan E3.
# Key `model` dan `data` relatif terhadap root project (di-resolve oleh train.py).
# ==============================================================================

model: pretrained/yolov8l.pt   # Pretrained COCO
data: data/data.yaml
name: yolov8l_960_augnoise

# --- Jadwal training ---
epochs: 100
patience: 25
imgsz: 960          # Batas aman VRAM 8GB dengan batch=4
batch: 4            # nbs=64 -> gradient accumulation otomatis 16 step
workers: 2          # >2 memicu lonjakan RAM di Windows
seed: 42
deterministic: true

# --- Optimizer ---
optimizer: AdamW
lr0: 0.001
lrf: 0.01
cos_lr: true
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
warmup_momentum: 0.8

# --- Bobot loss (single-class, objek kecil) ---
box: 10.0
cls: 0.3
dfl: 2.0

# --- Augmentasi ---
mosaic: 1.0
close_mosaic: 10
mixup: 0.1
copy_paste: 0.0     # Run asli memakai 0.3, tetapi copy_paste hanya aktif untuk label segmentasi
                    # (label kita bbox) sehingga no-op. Diset 0.0 agar jujur; hasil identik.
fliplr: 0.5
flipud: 0.5
degrees: 10.0
translate: 0.1
scale: 0.5
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4

# --- Albumentations (E11) ---
albumentations:
  - name: GaussNoise
    std_range: [0.02, 0.06]   # std 2-6% rentang piksel (~5-15 / 255); default albumentations 2.x 0.2-0.44 terlalu kuat untuk lesi ~12 px
    p: 0.2
  - name: RandomBrightnessContrast
    brightness_limit: 0.2
    contrast_limit: 0.2
    p: 0.3
