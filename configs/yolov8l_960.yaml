# ==============================================================================
# AcneVision - Konfigurasi training model terpilih: YOLOv8l @ 960px
# ==============================================================================
# Reproduksi run `runs/detect/yolov8l_960` (Test mAP@50 = 49.24%).
# Dipakai oleh: python scripts/train.py --cfg configs/yolov8l_960.yaml
#
# Key `model` dan `data` relatif terhadap root project (di-resolve oleh train.py).
# Key lain diteruskan apa adanya ke `YOLO.train()` (lihat docs.ultralytics.com/usage/cfg).
# Untuk eksperimen baru: COPY file ini, ubah SATU variabel, beri nama baru.
# ==============================================================================

model: pretrained/yolov8l.pt   # Pretrained COCO
data: data/data.yaml
name: yolov8l_960

# --- Jadwal training ---
epochs: 100
patience: 25
imgsz: 960          # Batas aman VRAM 8GB dengan batch=4
batch: 4            # nbs=64 -> gradient accumulation otomatis 16 step
workers: 2          # >2 memicu lonjakan RAM di Windows
seed: 42
deterministic: true

# --- Optimizer ---
optimizer: AdamW
lr0: 0.001
lrf: 0.01
cos_lr: true
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
warmup_momentum: 0.8

# --- Bobot loss (single-class, objek kecil) ---
box: 10.0
cls: 0.3
dfl: 2.0

# --- Augmentasi ---
mosaic: 1.0
close_mosaic: 10
mixup: 0.1
copy_paste: 0.0     # Run asli memakai 0.3, tetapi copy_paste hanya aktif untuk label segmentasi
                    # (label kita bbox) sehingga no-op. Diset 0.0 agar jujur; hasil identik.
fliplr: 0.5
flipud: 0.5
degrees: 10.0
translate: 0.1
scale: 0.5
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
